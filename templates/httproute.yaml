{{- if .Values.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "controlplane.fullname" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.gateway.name }}
      {{- if .Values.gatewayApi.gateway.namespace }}
      namespace: {{ .Values.gatewayApi.gateway.namespace }}
      {{- end }}
      {{- if .Values.gatewayApi.gateway.sectionName }}
      sectionName: {{ .Values.gatewayApi.gateway.sectionName }}
      {{- end }}
  {{- if .Values.gatewayApi.hostnames }}
  hostnames:
    {{- range .Values.gatewayApi.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml .Values.gatewayApi.matches | nindent 8 }}
      backendRefs:
        - name: {{ include "controlplane.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
