{{- if eq (include "controlplane.liveViewAffinity.enabled" .) "true" }}
{{- $lv := .Values.gatewayApi.liveViewAffinity | default dict }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "controlplane.fullname" . }}-liveview-affinity
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "controlplane.fullname" . }}
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: {{ $lv.cookieName | default "fluid_controlplane_liveview" | quote }}
        ttl: {{ $lv.cookieTtl | default "86400s" | quote }}
        attributes:
          SameSite: {{ $lv.cookieSameSite | default "Lax" | quote }}
{{- end }}
