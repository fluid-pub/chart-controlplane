{{- if eq (include "controlplane.agentAffinity.enabled" .) "true" }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "controlplane.fullname" . }}-agents-affinity
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "controlplane.fullname" . }}-agents
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Header
      header:
        name: {{ .Values.gatewayApi.agentAffinity.consistentHashHeader | default "authorization" | quote }}
{{- end }}
