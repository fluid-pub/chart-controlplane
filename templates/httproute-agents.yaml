{{- if eq (include "controlplane.agentAffinity.enabled" .) "true" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "controlplane.fullname" . }}-agents
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.gateway.name }}
      {{- if .Values.gatewayApi.gateway.namespace }}
      namespace: {{ .Values.gatewayApi.gateway.namespace }}
      {{- end }}
      {{- if .Values.gatewayApi.gateway.sectionName }}
      sectionName: {{ .Values.gatewayApi.gateway.sectionName }}
      {{- end }}
  {{- if .Values.gatewayApi.hostnames }}
  hostnames:
    {{- range .Values.gatewayApi.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gatewayApi.agentAffinity.routePath | default "/v1/agents/websocket" | quote }}
      backendRefs:
        - name: {{ include "controlplane.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
